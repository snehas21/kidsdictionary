<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Dictionary</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 40%, #a1c4fd 100%);
      min-height: 100vh;
      padding: 20px 14px 60px;
      /* prevent iOS text size inflation */
      -webkit-text-size-adjust: 100%;
    }

    /* ── HEADER ── */
    .app-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .app-icon {
      font-size: 56px;
      display: block;
      animation: float 3s ease-in-out infinite;
      line-height: 1;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 3px 12px rgba(0,0,0,0.2);
      margin-top: 6px;
    }

    .tagline {
      color: rgba(255,255,255,0.85);
      font-size: 1rem;
      margin-top: 4px;
    }

    /* ── SEARCH AREA ── */
    .search-wrap {
      max-width: 580px;
      margin: 0 auto 24px;
    }

    /* Top row: input only */
    .search-input-row {
      position: relative;
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 18px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #333;
      background: #fff;
      box-shadow: 0 6px 24px rgba(0,0,0,0.15);
      outline: none;
      transition: box-shadow 0.2s;
      /* prevent zoom on iOS (font-size >= 16px) */
      font-size: 16px;
    }

    .search-input::placeholder { color: #aaa; font-weight: 400; }
    .search-input:focus { box-shadow: 0 8px 32px rgba(0,0,0,0.22); }

    /* Bottom row: mic + search buttons */
    .search-actions {
      display: flex;
      gap: 10px;
    }

    /* ── MIC BUTTON ── */
    .mic-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 16px;
      padding: 14px 18px;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(102, 126, 234, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
      min-height: 54px;
      /* prevent text select on double-tap */
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .mic-btn:hover  { transform: scale(1.03); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.55); }
    .mic-btn:active { transform: scale(0.97); }

    .mic-btn svg { flex-shrink: 0; }

    .mic-btn.listening {
      background: linear-gradient(135deg, #f12711, #f5af19);
      box-shadow: 0 0 0 0 rgba(241, 39, 17, 0.5);
      animation: mic-ring 1.1s ease-out infinite;
    }

    @keyframes mic-ring {
      0%   { box-shadow: 0 0 0 0   rgba(241, 39, 17, 0.55); }
      70%  { box-shadow: 0 0 0 16px rgba(241, 39, 17, 0); }
      100% { box-shadow: 0 0 0 0   rgba(241, 39, 17, 0); }
    }

    /* ── SEARCH BUTTON ── */
    .search-btn {
      flex: 1;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      border: none;
      border-radius: 16px;
      padding: 14px 18px;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 87, 108, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      min-height: 54px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .search-btn:hover  { transform: scale(1.03); box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5); }
    .search-btn:active { transform: scale(0.97); }

    /* ── MIC TOAST ── */
    .mic-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(20, 20, 30, 0.92);
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
      max-width: 90vw;
      text-align: center;
    }

    .mic-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── WORD CARD ── */
    .card {
      max-width: 580px;
      margin: 0 auto 20px;
      background: #fff;
      border-radius: 22px;
      padding: 24px 22px 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92) translateY(16px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }

    /* ── WORD TITLE ROW ── */
    .word-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 6px;
    }

    .word-title {
      font-size: 2rem;
      font-weight: 900;
      color: #222;
      text-transform: capitalize;
    }

    .part-of-speech {
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 4px 13px;
      border-radius: 50px;
    }

    /* ── PRONUNCIATION ROW ── */
    .pronunciation-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .phonetic-text {
      color: #888;
      font-size: 1rem;
      font-style: italic;
    }

    .hear-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      border: none;
      border-radius: 50px;
      padding: 9px 20px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(67, 233, 123, 0.4);
      transition: transform 0.15s;
      min-height: 42px;
      touch-action: manipulation;
    }

    .hear-btn:active { transform: scale(0.95); }

    .hear-btn.playing {
      background: linear-gradient(135deg, #f5af19, #f12711);
      animation: pulse-btn 0.7s ease-in-out infinite alternate;
    }

    @keyframes pulse-btn {
      from { transform: scale(1); }
      to   { transform: scale(1.07); }
    }

    /* ── SECTION LABELS ── */
    .section-label {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #bbb;
      margin-bottom: 6px;
    }

    /* ── MEANING ── */
    .meaning-block {
      background: #fef9ee;
      border-left: 5px solid #f9ca24;
      border-radius: 0 14px 14px 0;
      padding: 13px 15px;
      margin-bottom: 14px;
    }

    .meaning-text {
      font-size: 1.05rem;
      color: #333;
      line-height: 1.65;
    }

    /* ── EXAMPLE SENTENCE ── */
    .example-block {
      background: #eef7ff;
      border-left: 5px solid #74b9ff;
      border-radius: 0 14px 14px 0;
      padding: 13px 15px;
      margin-bottom: 14px;
    }

    .example-text {
      font-size: 0.97rem;
      color: #555;
      font-style: italic;
      line-height: 1.65;
    }

    .example-text::before { content: '"'; }
    .example-text::after  { content: '"'; }

    .no-example { color: #bbb; font-size: 0.9rem; font-style: italic; }

    /* ── MORE MEANINGS TOGGLE ── */
    .more-btn {
      width: 100%;
      background: none;
      border: 2px solid #e0e0e0;
      border-radius: 14px;
      padding: 12px 18px;
      color: #888;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      margin-top: 6px;
      min-height: 48px;
      touch-action: manipulation;
    }

    .more-btn:hover { border-color: #a18cd1; color: #a18cd1; }

    .extra-meanings { display: none; margin-top: 14px; }
    .extra-meanings.open { display: block; }

    .meaning-item {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px dashed #eee;
    }

    .meaning-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    /* ── ERROR CARD ── */
    .error-card {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 22px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .error-icon { font-size: 52px; margin-bottom: 12px; }

    .error-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #f5576c;
      margin-bottom: 6px;
    }

    .error-msg { color: #888; font-size: 0.95rem; }

    /* ── LOADING ── */
    .spinner-wrap {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
      padding: 40px;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 6px solid rgba(255,255,255,0.5);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner-text { color: #fff; font-size: 1.05rem; font-weight: 600; }

    /* ── WELCOME HINT ── */
    .welcome-hint {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
      padding: 10px 4px;
    }

    .welcome-title {
      color: rgba(255,255,255,0.9);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .hint-bubbles {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .hint-bubble {
      background: rgba(255,255,255,0.38);
      backdrop-filter: blur(6px);
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 50px;
      padding: 10px 20px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      min-height: 44px;
      touch-action: manipulation;
    }

    .hint-bubble:active { transform: scale(0.95); }

    /* ── DESKTOP ENHANCEMENTS ── */
    @media (min-width: 540px) {
      body { padding: 28px 20px 60px; }

      h1 { font-size: 2.4rem; }

      /* On wider screens: put input + buttons all in one row */
      .search-wrap { position: relative; }

      .search-input-row { margin-bottom: 0; }

      .search-input {
        font-size: 1.15rem;
        border-radius: 50px;
        padding: 17px 200px 17px 22px;
      }

      .search-actions {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        gap: 6px;
        width: auto;
      }

      .mic-btn {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        padding: 0;
        min-height: unset;
      }

      .mic-btn .mic-label { display: none; }

      .search-btn {
        flex: none;
        border-radius: 50px;
        padding: 10px 20px;
        font-size: 0.98rem;
        min-height: unset;
        height: 48px;
      }

      .word-title { font-size: 2.2rem; }
      .card { padding: 28px 28px 24px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <span class="app-icon">📖</span>
    <h1>Kids Dictionary</h1>
    <p class="tagline">Look up any word — fast &amp; fun!</p>
  </header>

  <div class="search-wrap">
    <div class="search-input-row">
      <input
        id="search-input"
        class="search-input"
        type="text"
        placeholder="Type a word, e.g. happy…"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
        enterkeyhint="search"
      />
    </div>
    <div class="search-actions">
      <button class="mic-btn" id="mic-btn" title="Speak a word" aria-label="Speak a word">
        <!-- Microphone SVG icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true">
          <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4z"/>
          <path d="M19 10a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V19H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 10z"/>
        </svg>
        <span class="mic-label">Speak</span>
      </button>
      <button class="search-btn" id="search-btn">Search 🔍</button>
    </div>
  </div>

  <div class="mic-toast" id="mic-toast"></div>

  <div id="result-area"></div>

<script>
const API_BASE = 'https://api.dictionaryapi.dev/api/v2/entries/en/';

const input   = document.getElementById('search-input');
const btn     = document.getElementById('search-btn');
const area    = document.getElementById('result-area');

let currentUtterance = null;
let currentAudio     = null;

showWelcome();

// ── EVENT LISTENERS ────────────────────────────
btn.addEventListener('click', doSearch);
input.addEventListener('keydown', e => { if (e.key === 'Enter') { input.blur(); doSearch(); } });

// ── SPEECH RECOGNITION ─────────────────────────
const micBtn   = document.getElementById('mic-btn');
const micToast = document.getElementById('mic-toast');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition  = null;
let micListening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang           = 'en-US';
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    micListening = true;
    micBtn.classList.add('listening');
    setMicIcon('stop');
    showToast('🎤 Listening… say a word!');
  };

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript.trim();
    input.value = transcript;
    if (e.results[0].isFinal) {
      hideToast();
      stopMic();
      doSearch();
    }
  };

  recognition.onerror = (e) => {
    stopMic();
    if (e.error === 'not-allowed') {
      showToast('❌ Microphone permission denied', 3500);
    } else if (e.error !== 'aborted') {
      showToast("❌ Didn't catch that — try again!", 2500);
    }
  };

  recognition.onend = () => stopMic();

  micBtn.addEventListener('click', () => {
    if (micListening) {
      recognition.abort();
    } else {
      input.value = '';
      area.innerHTML = '';
      recognition.start();
    }
  });
} else {
  micBtn.style.display = 'none';
}

function stopMic() {
  micListening = false;
  micBtn.classList.remove('listening');
  setMicIcon('mic');
}

function setMicIcon(mode) {
  const label = micBtn.querySelector('.mic-label');
  const svg   = micBtn.querySelector('svg');

  if (mode === 'stop') {
    svg.innerHTML = `<path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>`;
    svg.setAttribute('fill', 'none');
    if (label) label.textContent = 'Stop';
  } else {
    svg.setAttribute('fill', 'currentColor');
    svg.innerHTML = `
      <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4z"/>
      <path d="M19 10a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V19H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 10z"/>`;
    if (label) label.textContent = 'Speak';
  }
}

let toastTimer = null;
function showToast(msg, duration) {
  micToast.textContent = msg;
  micToast.classList.add('show');
  clearTimeout(toastTimer);
  if (duration) toastTimer = setTimeout(hideToast, duration);
}
function hideToast() { micToast.classList.remove('show'); }

// ── SEARCH ─────────────────────────────────────
async function doSearch() {
  const word = input.value.trim();
  if (!word) { input.focus(); return; }

  stopAnyAudio();
  showLoading();

  try {
    const res  = await fetch(API_BASE + encodeURIComponent(word.toLowerCase()));
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    showResult(data);
  } catch {
    showError(word);
  }
}

// ── RENDER RESULT ──────────────────────────────
function showResult(data) {
  const entry    = data[0];
  const word     = entry.word;
  const phonetic = getPhonetic(entry);
  const audioUrl = getAudioUrl(entry);
  const meanings = entry.meanings || [];

  if (!meanings.length) { showError(word); return; }

  const allDefs = [];
  for (const m of meanings) {
    for (const d of m.definitions) {
      allDefs.push({ pos: m.partOfSpeech, def: d.definition, ex: d.example || null });
    }
  }

  const first  = allDefs[0];
  const extras = allDefs.slice(1, 8);

  area.innerHTML = `
    <div class="card">
      <div class="word-title-row">
        <span class="word-title">${esc(word)}</span>
        <span class="part-of-speech">${esc(first.pos)}</span>
      </div>

      <div class="pronunciation-row">
        ${phonetic ? `<span class="phonetic-text">${esc(phonetic)}</span>` : ''}
        <button class="hear-btn" id="hear-btn">🔊 Hear it!</button>
      </div>

      <div class="section-label">Meaning</div>
      <div class="meaning-block">
        <div class="meaning-text">${esc(first.def)}</div>
      </div>

      <div class="section-label">Example</div>
      <div class="example-block">
        ${first.ex
          ? `<div class="example-text">${esc(first.ex)}</div>`
          : `<div class="no-example">No example available for this meaning.</div>`
        }
      </div>

      ${extras.length ? `
        <button class="more-btn" id="more-btn">Show more meanings (${extras.length})</button>
        <div class="extra-meanings" id="extra-meanings">
          ${extras.map(d => `
            <div class="meaning-item">
              <div class="word-title-row" style="margin-bottom:6px">
                <span class="part-of-speech">${esc(d.pos)}</span>
              </div>
              <div class="section-label">Meaning</div>
              <div class="meaning-block">
                <div class="meaning-text">${esc(d.def)}</div>
              </div>
              ${d.ex ? `
                <div class="section-label">Example</div>
                <div class="example-block">
                  <div class="example-text">${esc(d.ex)}</div>
                </div>` : ''}
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;

  document.getElementById('hear-btn').addEventListener('click', () => speakWord(word, audioUrl));

  const moreBtn = document.getElementById('more-btn');
  if (moreBtn) {
    moreBtn.addEventListener('click', () => {
      const panel = document.getElementById('extra-meanings');
      const open  = panel.classList.toggle('open');
      moreBtn.textContent = open ? 'Hide extra meanings' : `Show more meanings (${extras.length})`;
    });
  }
}

// ── SPEAK ──────────────────────────────────────
function speakWord(word, audioUrl) {
  stopAnyAudio();

  const hearBtn = document.getElementById('hear-btn');
  if (hearBtn) { hearBtn.classList.add('playing'); hearBtn.textContent = '🔊 Playing…'; }

  const done = () => {
    if (hearBtn) { hearBtn.classList.remove('playing'); hearBtn.textContent = '🔊 Hear it!'; }
  };

  if (audioUrl) {
    currentAudio = new Audio(audioUrl);
    currentAudio.onended = done;
    currentAudio.onerror = () => ttsSpeak(word, done);
    currentAudio.play().catch(() => ttsSpeak(word, done));
    return;
  }

  ttsSpeak(word, done);
}

function ttsSpeak(word, done) {
  if (!('speechSynthesis' in window)) { done(); return; }
  window.speechSynthesis.cancel();
  const utt        = new SpeechSynthesisUtterance(word);
  utt.lang         = 'en-US';
  utt.rate         = 0.85;
  utt.onend        = done;
  utt.onerror      = done;
  currentUtterance = utt;
  window.speechSynthesis.speak(utt);
}

function stopAnyAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentUtterance && 'speechSynthesis' in window) window.speechSynthesis.cancel();
  currentUtterance = null;
}

// ── HELPERS ────────────────────────────────────
function getPhonetic(entry) {
  if (entry.phonetic) return entry.phonetic;
  const p = (entry.phonetics || []).find(p => p.text);
  return p ? p.text : null;
}

function getAudioUrl(entry) {
  const p = (entry.phonetics || []).find(p => p.audio && p.audio.trim());
  if (!p) return null;
  return p.audio.startsWith('//') ? 'https:' + p.audio : p.audio;
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── STATES ─────────────────────────────────────
function showLoading() {
  area.innerHTML = `
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div class="spinner-text">Looking it up…</div>
    </div>`;
}

function showError(word) {
  area.innerHTML = `
    <div class="error-card">
      <div class="error-icon">🤔</div>
      <div class="error-title">Hmm, we couldn't find "${esc(word)}"</div>
      <div class="error-msg">Check the spelling and try again!</div>
    </div>`;
}

function showWelcome() {
  const suggestions = ['happy', 'elephant', 'volcano', 'brave', 'ocean', 'rainbow'];
  area.innerHTML = `
    <div class="welcome-hint">
      <div class="welcome-title">Try one of these words:</div>
      <div class="hint-bubbles">
        ${suggestions.map(w => `<button class="hint-bubble" data-word="${w}">${w}</button>`).join('')}
      </div>
    </div>`;

  document.querySelectorAll('.hint-bubble').forEach(b => {
    b.addEventListener('click', () => {
      input.value = b.dataset.word;
      doSearch();
    });
  });
}
</script>
</body>
</html>
